name: Release Android

# Android releases are tagged independently from desktop releases:
#   Desktop: `v0.1.0-beta.15`        -> handled by release-beta.yml (desktop)
#   Android: `android-v0.1.0-beta.1` -> handled by this workflow
# The `android-` prefix guarantees this workflow never fires for desktop tags
# and that release-beta.yml (`v*-beta.*`) never fires for Android tags.

on:
  push:
    tags:
      - 'android-v*'

permissions:
  contents: write

jobs:
  build-and-release:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Setup Java
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '17'

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Verify Android Release Version
        id: verify-tag
        env:
          TAG_NAME: ${{ github.ref_name }}
        run: |
          node --test scripts/android-version.test.mjs
          node scripts/android-version.mjs check "$TAG_NAME"
          VERSION=$(node scripts/android-version.mjs version)
          echo "VERSION=$VERSION" >> "$GITHUB_OUTPUT"
          if [[ "$VERSION" == *-* ]]; then
            echo "PRERELEASE=true" >> "$GITHUB_OUTPUT"
          else
            echo "PRERELEASE=false" >> "$GITHUB_OUTPUT"
          fi

      - name: Configure Release Signing
        id: configure-signing
        env:
          ANDROID_KEYSTORE_BASE64: ${{ secrets.ANDROID_KEYSTORE_BASE64 }}
          ANDROID_KEYSTORE_PASSWORD: ${{ secrets.ANDROID_KEYSTORE_PASSWORD }}
          ANDROID_KEY_ALIAS: ${{ secrets.ANDROID_KEY_ALIAS }}
          ANDROID_KEY_PASSWORD: ${{ secrets.ANDROID_KEY_PASSWORD }}
        run: |
          cd apps/android

          if [ -n "$ANDROID_KEYSTORE_BASE64" ] && [ -n "$ANDROID_KEYSTORE_PASSWORD" ] && [ -n "$ANDROID_KEY_ALIAS" ] && [ -n "$ANDROID_KEY_PASSWORD" ]; then
            echo "Using release keystore provided via repository secrets."
            echo "$ANDROID_KEYSTORE_BASE64" | base64 --decode > release.keystore
            {
              printf 'storeFile=release.keystore\n'
              printf 'storePassword=%s\n' "$ANDROID_KEYSTORE_PASSWORD"
              printf 'keyAlias=%s\n' "$ANDROID_KEY_ALIAS"
              printf 'keyPassword=%s\n' "$ANDROID_KEY_PASSWORD"
            } > keystore.properties
          else
            echo "::error::All four Android signing secrets are required. Reuse the Beta 1 signing key so users can upgrade."
            exit 1
          fi

      - name: Validate Android
        run: ./gradlew :app:testDebugUnitTest :app:lintDebug --no-daemon
        working-directory: ./apps/android

      - name: Build Release APK
        run: ./gradlew :app:assembleRelease --no-daemon
        working-directory: ./apps/android

      - name: Rename Release APK
        run: |
          APK_DIR=apps/android/app/build/outputs/apk/release
          ls -la "$APK_DIR"
          cp "$APK_DIR/app-release.apk" "DropFlow-android-${{ steps.verify-tag.outputs.VERSION }}.apk"

      - name: Verify APK Version and Original Signing Certificate
        env:
          VERSION: ${{ steps.verify-tag.outputs.VERSION }}
        run: |
          SDK_ROOT="${ANDROID_HOME:-$ANDROID_SDK_ROOT}"
          SIGNER=$(ls -1 "$SDK_ROOT"/build-tools/*/apksigner | sort -V | tail -n 1)
          AAPT="$(dirname "$SIGNER")/aapt"
          APK="DropFlow-android-${VERSION}.apk"
          EXPECTED_CERT=$(node -p 'require("./apps/android/release-baseline.json").signingCertificateSha256')
          ACTUAL_CERT=$("$SIGNER" verify --print-certs "$APK" | sed -n 's/^Signer #1 certificate SHA-256 digest: //p')
          test "$ACTUAL_CERT" = "$EXPECTED_CERT" || { echo "::error::APK does not use the published Android signing key"; exit 1; }
          BADGING=$("$AAPT" dump badging "$APK")
          ACTUAL_CODE=$(printf '%s' "$BADGING" | sed -n "s/^package: .*versionCode='\([^']*\)'.*/\1/p")
          ACTUAL_VERSION=$(printf '%s' "$BADGING" | sed -n "s/^package: .*versionName='\([^']*\)'.*/\1/p")
          test "$ACTUAL_CODE" = "$(node scripts/android-version.mjs code)"
          test "$ACTUAL_VERSION" = "$VERSION"

      - name: Create GitHub Release and Upload APK
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          TAG_NAME: ${{ github.ref_name }}
          VERSION: ${{ steps.verify-tag.outputs.VERSION }}
          PRERELEASE: ${{ steps.verify-tag.outputs.PRERELEASE }}
        run: |
          NOTES_FILE=$(mktemp)
          {
            echo "DropFlow for Android ${VERSION}"
            echo ""
            RELEASE_NOTES="docs/releases/android-${VERSION}.md"
            if [ -f "$RELEASE_NOTES" ]; then
              cat "$RELEASE_NOTES"
            else
              echo "See CHANGELOG.md for the changes in this Android release."
            fi
            echo ""
            echo "### Install"
            echo "- Download the APK below and open it on your device (Android 8.0+)."
            echo "- You may need to allow installing apps from this source."
          } > "$NOTES_FILE"

          FLAGS=()
          if [ "$PRERELEASE" = "true" ]; then FLAGS+=(--prerelease); fi
          gh release create "$TAG_NAME" \
            --title "DropFlow Android ${VERSION}" \
            --notes-file "$NOTES_FILE" \
            "${FLAGS[@]}" \
            "DropFlow-android-${VERSION}.apk"
