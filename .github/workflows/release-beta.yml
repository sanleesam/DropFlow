name: Release Beta

on:
  push:
    tags:
      - 'v*-beta.*'

jobs:
  publish-beta:
    permissions:
      contents: write

    strategy:
      fail-fast: false
      matrix:
        include:
          - platform: 'macos-latest'
            args: '--target aarch64-apple-darwin'

          - platform: 'windows-latest'
            args: '--target x86_64-pc-windows-msvc'

    runs-on: ${{ matrix.platform }}

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Setup pnpm
        uses: pnpm/action-setup@v4
        with:
          version: 11.9.0

      - name: Setup Rust Toolchain
        uses: dtolnay/rust-toolchain@stable

      - name: Install Frontend Dependencies
        run: pnpm install
        working-directory: ./apps/desktop

      - name: Build and Publish Beta Release
        uses: tauri-apps/tauri-action@v0
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          TAURI_SIGNING_PRIVATE_KEY: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY }}
          TAURI_SIGNING_PRIVATE_KEY_PASSWORD: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY_PASSWORD }}
          DROPFLOW_RELEASE_TAG: ${{ github.ref_name }}
        with:
          projectPath: ./apps/desktop
          args: ${{ matrix.args }}
          tagName: ${{ github.ref_name }}
          releaseName: 'DropFlow ${{ github.ref_name }}'
          releaseBody: |
            DropFlow beta release ${{ github.ref_name }}

            This build is for testing and feedback.
          prerelease: true
          includeUpdaterJson: true
          updaterJsonPreferNsis: true

      - name: Locate and Debug Manifest Files
        shell: bash
        run: |
          echo "=== Debugging latest.json location ==="
          find . -name "latest.json" -type f

      - name: Upload Platform Manifest Artifact
        uses: actions/upload-artifact@v4
        with:
          name: manifest-${{ matrix.platform }}
          path: |
            apps/desktop/src-tauri/target/**/latest.json
            apps/desktop/src-tauri/target/release/bundle/latest.json
            apps/desktop/src-tauri/target/release/latest.json
            apps/desktop/src-tauri/latest.json
            apps/desktop/latest.json
          if-no-files-found: error

  sync-beta-manifest:
    needs: publish-beta
    runs-on: ubuntu-latest
    permissions:
      contents: write

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Download Platform Manifest Artifacts
        uses: actions/download-artifact@v4
        with:
          path: /tmp/manifests

      - name: Merge Multi-Platform Manifests
        run: |
          python3 -c '
          import json, glob, os, sys

          merged = {}
          manifest_files = glob.glob("/tmp/manifests/**/latest.json", recursive=True)
          print(f"Found {len(manifest_files)} manifest files: {manifest_files}")

          if len(manifest_files) < 2:
              print(f"ERROR: Expected at least 2 platform manifests (macOS and Windows), but found {len(manifest_files)}.", file=sys.stderr)
              sys.exit(1)

          for path in manifest_files:
              with open(path) as f:
                  data = json.load(f)
                  if not merged:
                      merged = data
                  else:
                      if "platforms" in data:
                          if "platforms" not in merged:
                              merged["platforms"] = {}
                          merged["platforms"].update(data["platforms"])

          required_platforms = ["darwin-aarch64", "windows-x86_64"]
          missing = [p for p in required_platforms if p not in merged.get("platforms", {})]
          if missing:
              print(f"ERROR: Merged manifest is missing required platform(s): {missing}", file=sys.stderr)
              sys.exit(1)

          os.makedirs("/tmp/merged", exist_ok=True)
          out_path = "/tmp/merged/latest.json"
          with open(out_path, "w") as f:
              json.dump(merged, f, indent=2)

          print("Successfully generated complete multi-platform manifest:")
          print(json.dumps(merged, indent=2))
          '

      - name: Upload Merged Manifest to Release Tag & Beta Channel
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          gh release upload "${{ github.ref_name }}" /tmp/merged/latest.json --clobber
          gh release create beta --title "DropFlow Beta Channel" --notes "DropFlow beta release channel updater manifest" --prerelease 2>/dev/null || true
          gh release upload beta /tmp/merged/latest.json --clobber