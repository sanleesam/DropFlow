name: Release Beta

on:
  push:
    tags:
      - 'v*-beta.*'

jobs:
  publish-beta:
    permissions:
      contents: write

    strategy:
      fail-fast: false
      matrix:
        include:
          - platform: 'macos-latest'
            args: '--target aarch64-apple-darwin'

          - platform: 'windows-latest'
            args: '--target x86_64-pc-windows-msvc'

    runs-on: ${{ matrix.platform }}

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Setup pnpm
        uses: pnpm/action-setup@v4
        with:
          version: 11.9.0

      - name: Setup Rust Toolchain
        uses: dtolnay/rust-toolchain@stable

      - name: Install Frontend Dependencies
        run: pnpm install
        working-directory: ./apps/desktop

      - name: Build and Publish Beta Release
        uses: tauri-apps/tauri-action@v0
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          TAURI_SIGNING_PRIVATE_KEY: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY }}
          TAURI_SIGNING_PRIVATE_KEY_PASSWORD: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY_PASSWORD }}
          DROPFLOW_RELEASE_TAG: ${{ github.ref_name }}
        with:
          projectPath: ./apps/desktop
          args: ${{ matrix.args }}
          tagName: ${{ github.ref_name }}
          releaseName: 'DropFlow ${{ github.ref_name }}'
          releaseBody: |
            DropFlow beta release ${{ github.ref_name }}

            This build is for testing and feedback.
          prerelease: true
          includeUpdaterJson: true
          updaterJsonPreferNsis: true

  sync-beta-channel:
    needs: publish-beta
    runs-on: ubuntu-latest
    permissions:
      contents: write

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Download and Verify Merged Manifest from Release Tag
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          mkdir -p /tmp/beta-manifest
          gh release download "${{ github.ref_name }}" --pattern "latest.json" --dir /tmp/beta-manifest --clobber

          python3 -c '
          import json, sys

          path = "/tmp/beta-manifest/latest.json"
          with open(path) as f:
              data = json.load(f)

          print("Downloaded manifest from GitHub Release:")
          print(json.dumps(data, indent=2))

          platforms = data.get("platforms", {})
          required = ["darwin-aarch64", "windows-x86_64"]
          missing = [p for p in required if p not in platforms]

          if missing:
              print(f"ERROR: Published latest.json is missing platform(s): {missing}", file=sys.stderr)
              sys.exit(1)

          print("Validation successful: All target platforms present in manifest.")
          '

      - name: Publish Manifest to Beta Channel Floating Tag
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          gh release create beta --title "DropFlow Beta Channel" --notes "DropFlow beta release channel updater manifest" --prerelease 2>/dev/null || true
          gh release upload beta /tmp/beta-manifest/latest.json --clobber