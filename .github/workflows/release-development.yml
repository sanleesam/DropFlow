name: Release Development

# DEVELOPMENT channel. Frequent experimental builds, fully independent of Beta:
#   Beta:        tags `v*-beta.*` + floating `beta` release   -> release-beta.yml
#   Development: main, manual or `v*-dev.*` tags + floating `development` release -> this workflow
#
# Explicit Development tags pin the version (for example v0.1.0-dev.8).
# Main/manual branch builds retain automatic run numbering. Neither path touches
# the Beta release. One resolver supplies every build and manifest version.

# Each build stages installers under its version tag. Only the sync job updates
# the floating Development manifest, after BOTH platforms pass. Partial builds
# cannot mutate installers referenced by the last complete channel manifest.
# Serialize channel publication; Beta has its own independent workflow.
concurrency:
  group: release-development
  cancel-in-progress: true

on:
  push:
    branches:
      - main
    tags:
      - 'v*-dev.*'
  workflow_dispatch:

jobs:
  resolve-version:
    runs-on: ubuntu-latest
    permissions:
      contents: read
    outputs:
      version: ${{ steps.version.outputs.version }}
      tag: ${{ steps.version.outputs.tag }}
    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4
      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Test Development Version Resolution
        run: node --test scripts/desktop-version.test.mjs scripts/resolve-development-version.test.mjs scripts/release-workflow.test.mjs
      - name: Resolve Canonical Development Version
        id: version
        run: node scripts/resolve-development-version.mjs

  publish-development:
    needs: resolve-version
    permissions:
      contents: write
    env:
      DEV_VERSION: ${{ needs.resolve-version.outputs.version }}
      DEV_TAG: ${{ needs.resolve-version.outputs.tag }}

    strategy:
      fail-fast: false
      matrix:
        include:
          - platform: 'macos-latest'
            args: '--target aarch64-apple-darwin'
            updater_key: 'darwin-aarch64'

          - platform: 'windows-latest'
            args: '--target x86_64-pc-windows-msvc'
            updater_key: 'windows-x86_64'

    runs-on: ${{ matrix.platform }}

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Setup pnpm
        uses: pnpm/action-setup@v4
        with:
          version: 11.9.0

      - name: Setup Rust Toolchain
        uses: dtolnay/rust-toolchain@stable

      - name: Install Frontend Dependencies
        run: pnpm install --frozen-lockfile
        working-directory: ./apps/desktop

      - name: Run Frontend Regression Checks
        run: pnpm test:ui && pnpm build
        working-directory: ./apps/desktop

      - name: Run Rust Regression Tests
        run: cargo test --locked
        working-directory: ./apps/desktop/src-tauri

      - name: Sync Application Version with Development Release
        shell: bash
        run: |
          node --test scripts/desktop-version.test.mjs
          node scripts/desktop-version.mjs set "$DEV_VERSION"

      - name: Build and Publish Development Release
        uses: tauri-apps/tauri-action@v0
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          TAURI_SIGNING_PRIVATE_KEY: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY }}
          TAURI_SIGNING_PRIVATE_KEY_PASSWORD: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY_PASSWORD }}
          DROPFLOW_RELEASE_TAG: ${{ env.DEV_TAG }}
        with:
          projectPath: ./apps/desktop
          args: ${{ matrix.args }}
          tagName: ${{ env.DEV_TAG }}
          releaseCommitish: ${{ github.sha }}
          releaseName: 'DropFlow ${{ env.DEV_VERSION }} Development'
          releaseDraft: true
          releaseBody: |
            Development builds published from `main`, manual runs or explicit Development tags.

            Latest build: `${{ env.DEV_VERSION }}` (commit ${{ github.sha }}).

            These builds may contain unfinished or unstable changes. For curated
            milestone releases, switch to the **Beta** channel in Settings → About.
          prerelease: true
          includeUpdaterJson: true
          updaterJsonPreferNsis: true

      # Same per-platform manifest protection as the Beta workflow: each matrix
      # job publishes its own latest.json as a uniquely named artifact so
      # concurrent jobs can never overwrite each other's manifests.
      - name: Verify Platform Updater Manifest
        env:
          EXPECTED_PLATFORM: ${{ matrix.updater_key }}
          EXPECTED_VERSION: ${{ env.DEV_VERSION }}
        shell: bash
        run: |
          node -e "
            const fs = require('fs');
            const key = process.env.EXPECTED_PLATFORM;
            const data = JSON.parse(fs.readFileSync('latest.json', 'utf8'));
            if (data.version !== process.env.EXPECTED_VERSION) {
              console.error('ERROR: updater manifest version does not match ' + process.env.EXPECTED_VERSION);
              process.exit(1);
            }
            const entry = (data.platforms || {})[key];
            if (!entry) {
              console.error('ERROR: updater manifest is missing platform ' + key);
              process.exit(1);
            }
            if (!entry.signature || !entry.url) {
              console.error('ERROR: platform ' + key + ' has an empty signature or url');
              process.exit(1);
            }
            console.log('Updater manifest OK for ' + key + ' (advertised version: ' + data.version + ')');
          "

      - name: Upload Platform Updater Manifest Artifact
        uses: actions/upload-artifact@v4
        with:
          name: updater-manifest-${{ matrix.updater_key }}
          path: latest.json
          if-no-files-found: error

  sync-development-channel:
    needs: [resolve-version, publish-development]
    runs-on: ubuntu-latest
    permissions:
      contents: write
    env:
      DEV_VERSION: ${{ needs.resolve-version.outputs.version }}
      DEV_TAG: ${{ needs.resolve-version.outputs.tag }}

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Download Platform Updater Manifest Artifacts
        uses: actions/download-artifact@v4
        with:
          pattern: updater-manifest-*
          path: manifests

      # Merge every platform manifest into ONE latest.json. Each platform's
      # artifact is authoritative for its own key AND its variants
      # (windows-x86_64-nsis, darwin-aarch64-app, ...): tauri-action hydrates
      # each artifact with the PREVIOUS release manifest, so variant keys must
      # be refreshed from their owning platform or a stale previous-run
      # installer would survive the merge. Keys owned by no current platform
      # are untouched fallbacks.
      - name: Merge Platform Manifests into One latest.json
        env:
          REQUIRED_PLATFORMS: 'darwin-aarch64 windows-x86_64'
        run: |
          python3 - <<'EOF'
          import glob, json, os, sys

          version = os.environ["DEV_VERSION"]
          tag = os.environ["DEV_TAG"]
          required_platforms = os.environ["REQUIRED_PLATFORMS"].split()

          paths = sorted(glob.glob("manifests/*/latest.json"))
          if not paths:
              sys.exit("ERROR: no updater manifest artifacts were downloaded")

          merged = None
          platforms = {}
          for path in paths:
              owner = os.path.basename(os.path.dirname(path)).removeprefix("updater-manifest-")
              with open(path) as f:
                  data = json.load(f)
              if data.get("version") != version:
                  sys.exit(f"ERROR: {path} advertises version {data.get('version')!r}, expected {version!r}")
              if merged is None:
                  merged = {k: v for k, v in data.items() if k != "platforms"}
              for key, entry in data.get("platforms", {}).items():
                  if not isinstance(entry, dict) or not entry.get("signature") or not entry.get("url"):
                      sys.exit(f"ERROR: platform '{key}' in {path} has an incomplete updater entry: {entry}")
                  if f"/releases/download/{tag}/" not in entry["url"]:
                      sys.exit(f"ERROR: platform '{key}' does not reference this versioned release")
                  owned = key == owner or key.startswith(owner + "-")
                  if key not in platforms or owned:
                      platforms[key] = entry

          missing = [p for p in required_platforms if p not in platforms]
          if missing:
              sys.exit(f"ERROR: merged latest.json is missing platform(s): {missing}")

          merged["version"] = version
          merged["platforms"] = platforms
          with open("latest.json", "w") as f:
              json.dump(merged, f, indent=2)

          print(f"Merged {len(paths)} platform manifest(s) into latest.json (version {version}):")
          print(json.dumps(merged, indent=2))
          EOF

      # The versioned release is complete before the floating channel changes.
      - name: Publish Merged Manifest to Development Channel
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          gh release upload "$DEV_TAG" latest.json --clobber
          gh release edit "$DEV_TAG" --draft=false
          gh release create development \
            --title "DropFlow Development Channel" \
            --notes "Frequent development builds. Latest: ${DEV_VERSION}." \
            --prerelease 2>/dev/null || true
          gh release upload development latest.json --clobber
          gh release edit development --notes "$(python3 -c 'import json; print(json.load(open("latest.json")).get("notes", "Development build"))')"

      # Legacy floating-release assets are retained. New installers live under
      # immutable version tags, so failed/partial builds cannot replace them.
