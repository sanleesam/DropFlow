[package]
name = "dropflow-nearby-windows-lab"
version = "0.1.0"
edition = "2021"
publish = false

[dependencies]
sha2 = "0.10"

[target.'cfg(windows)'.dependencies]
uuid = { version = "1", features = ["v4"] }
windows = { version = "0.61.3", features = [
    "Devices_Bluetooth", "Devices_Enumeration", "Devices_Radios", "Devices_WiFiDirect",
    "Foundation", "Networking_Connectivity", "Security_Credentials",
    "Win32_Foundation", "Win32_NetworkManagement_WiFi", "Win32_System_WinRT",
] }
windows-future = "0.2.1"
